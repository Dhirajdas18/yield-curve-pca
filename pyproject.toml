[project]
name = "yield-curve-pca"
version = "0.1.0"
description = "Principal components of the Indian government bond yield curve, 1996-2026 (RBI month-end SGL yields, 1-30 years): level, slope and curvature, their stability, hedging, prediction and Nelson-Siegel, with a live PCA lab."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
yc = "yc.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yc"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
